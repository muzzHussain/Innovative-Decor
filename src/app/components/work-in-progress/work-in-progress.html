<section class="min-h-screen flex flex-col items-center justify-center bg-gradient-to-br from-stone-50 to-stone-100 px-6 text-center">
  <div class="max-w-md">
    <!-- Animated Icon -->
    <div class="flex justify-center mb-8">
      <div class="relative flex items-center justify-center">
        <!-- Glowing Background -->
        <span class="absolute w-24 h-24 rounded-full blur-2xl animate-pulse-slow z-0 glow"></span>

        <!-- Proper Gear Icon animate-spin-slow-->
         <img src="assets/icons/gear-svgrepo-com.svg" alt="Gear" class="w-20 h-20 relative z-10 animate-spin-slow opacity-80">
      </div>
    </div>

    <!-- Text -->
    <h1 class="text-3xl font-bold text-stone-700 mb-4">Page Under Development</h1>
    <p class="text-stone-500 text-lg leading-relaxed mb-8">
      We're crafting something amazing here! This page is currently under construction.<br>
      Please check back soon for updates.
    </p>

    <!-- Button -->
    <a routerLink="/"
      class="inline-block bg-stone-700 hover:bg-stone-800 text-white font-medium px-6 py-3 rounded-2xl shadow transition-all">
      ← Back to Home
    </a>
  </div>
</section>
