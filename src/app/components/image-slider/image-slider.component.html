<div 
  #sliderContainer
  class="relative w-full aspect-[1.5/1] overflow-hidden select-none rounded-lg group"
  (mousemove)="onDrag($event)" 
  (touchmove)="onDrag($event)"
  (mouseleave)="stopDrag()"
  (mouseup)="stopDrag()"
  (touchend)="stopDrag()">

  @if(isBeforeLoading()||isAfterLoading()){
    <div class="absolute inset-0 shimmer"></div>
  }
  
  <!-- After Image (Top Layer) -->
  <div class="absolute inset-0">
    <!-- <img 
      [src]="afterImage()" 
      alt="After design" 
      class="w-full h-full object-cover object-left" 
      [style.clip-path]="'inset(0 ' + (100 - position()) + '% 0 0)'"
    > -->
    <img
      [src]="afterImage()"
      alt="After design"
      class="w-full h-full object-cover object-left transition-opacity" 
      [style.clip-path]="'inset(0 ' + (100 - position()) + '% 0 0)'"
      (load)="onAfterLoad()"
      (error)="onAfterLoad()"
      [class.opacity-0]="isAfterLoading()"
    >
  </div>
  
  <!-- Before Image (Bottom Layer) -->
  <div class="absolute inset-0">
    <!-- <img [src]="beforeImage()" alt="Before design" class="w-full h-full object-cover object-left"> -->
    <img 
      [src]="beforeImage()" 
      alt="Before design" 
      class="w-full h-full object-cover object-left transition-opacity"
      (load)="onBeforeLoad()" 
      (error)="onBeforeLoad()"
      [class.opacity-0]="isBeforeLoading()"
    >
  </div>

  <!-- Slider Handle -->
  <div class="absolute top-0 bottom-0 w-1 bg-white/70 cursor-ew-resize" 
       [style.left.%]="position()">
    <div 
      (mousedown)="startDrag()" 
      (touchstart)="startDrag()"
      class="absolute top-1/2 -translate-y-1/2 -ml-5 h-10 w-10 rounded-full bg-white/80 shadow-2xl flex items-center justify-center backdrop-blur-sm group-hover:opacity-100 opacity-70 transition-opacity">
      <svg class="w-6 h-6 text-stone-700" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l4-4 4 4m0 6l-4 4-4-4"></path>
      </svg>
    </div>
  </div>

  <!-- Labels -->
  <div class="absolute top-4 left-4 bg-black/50 text-white text-sm font-semibold px-3 py-1 rounded-full pointer-events-none">BEFORE</div>
  <div class="absolute top-4 right-4 bg-black/50 text-white text-sm font-semibold px-3 py-1 rounded-full pointer-events-none">AFTER</div>
</div>
