<div class="py-20 bg-white dark:bg-stone-900 transition-colors duration-300">
  <div class="container mx-auto px-6">
    <div class="text-center mb-16">
      <h1 class="text-4xl md:text-5xl font-bold font-serif text-stone-800 dark:text-stone-100 mb-4">From Plan to Perfection</h1>
      <p class="text-lg text-stone-600 dark:text-stone-300 max-w-3xl mx-auto">Witness how we transform 2D architectural drawings into stunning 3D realities. Drag the slider to see the magic unfold.</p>
    </div>

    <div class="space-y-20">
      @for (pair of designPairs; track pair.title) {
        <div class="bg-stone-50 dark:bg-stone-800 p-6 rounded-lg shadow-xl">
          <h2 class="text-2xl font-bold font-serif text-center dark:text-stone-100 mb-2">{{ pair.title }}</h2>
          <p class="text-stone-600 dark:text-stone-300 text-center mb-6">{{ pair.description }}</p>
          <app-image-slider [beforeImage]="pair.before" [afterImage]="pair.after"></app-image-slider>
        </div>
      }
    </div>
  </div>
</div>
