@if (isLoaderVisible()) {
  <div 
    class="fixed inset-0 bg-stone-800 z-[9999] flex flex-col items-center justify-center transition-opacity duration-500 ease-in-out"
    [class.opacity-0]="isLoaded()">
    <div class="text-3xl font-bold font-serif text-white tracking-wider mb-4 animate-fade-in-up">INNOVATIVE DECOR</div>
    <div class="w-16 h-16 border-4 border-t-amber-500 border-white rounded-full animate-spin"></div>
  </div>
}

<!-- class="flex flex-col min-h-screen bg-stone-50 transition-opacity duration-700" -->
<app-header></app-header>
<div 
  class="flex flex-col min-h-screen bg-stone-50"
  [class.opacity-0]="!isLoaded()">
  <main class="flex-grow transition-opacity duration-700">
    <router-outlet></router-outlet>
  </main>
  @if (showScrollTopButton()) {
  <button 
    (click)="scrollToTop()" 
    class="fixed animate-bounce bottom-6 right-6 bg-amber-500 hover:bg-amber-600 text-white p-3 rounded-full shadow-lg transition-all duration-300 z-50 animate-fade-in"
    title="Scroll to top"
  >
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7" />
    </svg>
  </button>
}
  <app-footer></app-footer>
</div>
