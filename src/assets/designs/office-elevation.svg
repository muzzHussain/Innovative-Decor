<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600">
  <!-- Background -->
  <rect width="1100" height="600" fill="#f4f1ec"/>
  <!-- Outer drawing frame -->
  <rect x="50" y="30" width="1000" height="510" fill="none" stroke="#999" stroke-width="1"/>

  <!-- ===== FLOOR LINE ===== -->
  <line x1="50" y1="460" x2="1050" y2="460" stroke="#333" stroke-width="2"/>

  <!-- ===== CEILING LINE ===== -->
  <line x1="50" y1="60" x2="1050" y2="60" stroke="#333" stroke-width="1.5"/>

  <!-- ===== BACK WALL (light warm grey) ===== -->
  <rect x="50" y="60" width="1000" height="400" fill="#e8e4de"/>

  <!-- ===== FULL-HEIGHT DARK WOOD SLAT PANEL (left portion, x=50-430) ===== -->
  <rect x="50" y="60" width="380" height="400" fill="#1c1a16"/>
  <!-- Vertical slats on dark panel -->
  <line x1="82"  y1="60" x2="82"  y2="460" stroke="#2a2820" stroke-width="1.2"/>
  <line x1="114" y1="60" x2="114" y2="460" stroke="#2a2820" stroke-width="1.2"/>
  <line x1="146" y1="60" x2="146" y2="460" stroke="#2a2820" stroke-width="1.2"/>
  <line x1="178" y1="60" x2="178" y2="460" stroke="#2a2820" stroke-width="1.2"/>
  <line x1="210" y1="60" x2="210" y2="460" stroke="#2a2820" stroke-width="1.2"/>
  <line x1="242" y1="60" x2="242" y2="460" stroke="#2a2820" stroke-width="1.2"/>
  <line x1="274" y1="60" x2="274" y2="460" stroke="#2a2820" stroke-width="1.2"/>
  <line x1="306" y1="60" x2="306" y2="460" stroke="#2a2820" stroke-width="1.2"/>
  <line x1="338" y1="60" x2="338" y2="460" stroke="#2a2820" stroke-width="1.2"/>
  <line x1="370" y1="60" x2="370" y2="460" stroke="#2a2820" stroke-width="1.2"/>
  <line x1="402" y1="60" x2="402" y2="460" stroke="#2a2820" stroke-width="1.2"/>

  <!-- Subtle warm strip along top of slat panel (LED reveal) -->
  <rect x="50" y="60" width="380" height="8" fill="#c8a030" opacity="0.35"/>

  <!-- Company name on slat panel (backlit text) -->
  <text x="240" y="200" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#d4c8a0" text-anchor="middle" letter-spacing="6">INNOVATIVE</text>
  <text x="240" y="220" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#d4c8a0" text-anchor="middle" letter-spacing="6">DECOR</text>
  <!-- Thin gold rule under brand -->
  <line x1="140" y1="230" x2="340" y2="230" stroke="#c8a030" stroke-width="1" opacity="0.7"/>

  <!-- ===== BACKLIT SIGNAGE PANEL (center, x=430-760) ===== -->
  <rect x="430" y="60" width="330" height="400" fill="#201e1a"/>
  <!-- Backlit warm glow edge at top -->
  <rect x="430" y="60" width="330" height="6" fill="#d4a030" opacity="0.4"/>
  <!-- Vertical highlight lines on center panel -->
  <line x1="462" y1="60" x2="462" y2="460" stroke="#302c26" stroke-width="1"/>
  <line x1="494" y1="60" x2="494" y2="460" stroke="#302c26" stroke-width="1"/>
  <line x1="526" y1="60" x2="526" y2="460" stroke="#302c26" stroke-width="1"/>
  <line x1="558" y1="60" x2="558" y2="460" stroke="#302c26" stroke-width="1"/>
  <line x1="590" y1="60" x2="590" y2="460" stroke="#302c26" stroke-width="1"/>
  <line x1="622" y1="60" x2="622" y2="460" stroke="#302c26" stroke-width="1"/>
  <line x1="654" y1="60" x2="654" y2="460" stroke="#302c26" stroke-width="1"/>
  <line x1="686" y1="60" x2="686" y2="460" stroke="#302c26" stroke-width="1"/>
  <line x1="718" y1="60" x2="718" y2="460" stroke="#302c26" stroke-width="1"/>
  <line x1="750" y1="60" x2="750" y2="460" stroke="#302c26" stroke-width="1"/>

  <!-- ===== LIGHT NEUTRAL RIGHT PANEL (x=760-1050) ===== -->
  <rect x="760" y="60" width="290" height="400" fill="#dedad4"/>
  <!-- Subtle horizontal shadow band mid-wall -->
  <rect x="760" y="230" width="290" height="2" fill="#c8c4be" opacity="0.6"/>

  <!-- ===== CEILING TRACK LIGHT RAIL ===== -->
  <rect x="100" y="60" width="900" height="6" fill="#c0bbb4"/>
  <!-- Track spots (8 spots along rail) -->
  <ellipse cx="160" cy="64" rx="10" ry="5" fill="#a8a4a0"/>
  <ellipse cx="270" cy="64" rx="10" ry="5" fill="#a8a4a0"/>
  <ellipse cx="380" cy="64" rx="10" ry="5" fill="#a8a4a0"/>
  <ellipse cx="490" cy="64" rx="10" ry="5" fill="#a8a4a0"/>
  <ellipse cx="600" cy="64" rx="10" ry="5" fill="#a8a4a0"/>
  <ellipse cx="710" cy="64" rx="10" ry="5" fill="#a8a4a0"/>
  <ellipse cx="820" cy="64" rx="10" ry="5" fill="#a8a4a0"/>
  <ellipse cx="930" cy="64" rx="10" ry="5" fill="#a8a4a0"/>
  <!-- Light cones from track spots -->
  <polygon points="160,70 135,200 185,200" fill="#fff8e0" opacity="0.06"/>
  <polygon points="380,70 355,200 405,200" fill="#fff8e0" opacity="0.06"/>
  <polygon points="600,70 575,200 625,200" fill="#fff8e0" opacity="0.06"/>
  <polygon points="820,70 795,200 845,200" fill="#fff8e0" opacity="0.06"/>

  <!-- ===== CURVED RECEPTION DESK ===== -->
  <!-- Main desk body (dark warm wood) -->
  <path d="M 760,380 Q 830,340 900,380 L 900,460 L 760,460 Z" fill="#2a2420"/>
  <!-- Desk front curved face highlight -->
  <path d="M 760,380 Q 830,340 900,380" fill="none" stroke="#3a3028" stroke-width="2"/>
  <!-- Desk stone top surface -->
  <path d="M 758,378 Q 830,337 902,378 L 906,382 Q 832,342 756,382 Z" fill="#c8c0b0"/>
  <!-- LED strip under desk top -->
  <path d="M 762,388 Q 830,348 898,388" fill="none" stroke="#c8a030" stroke-width="1.5" opacity="0.6"/>
  <!-- Vertical flute lines on desk front -->
  <line x1="790" y1="385" x2="790" y2="460" stroke="#3a3028" stroke-width="1" opacity="0.5"/>
  <line x1="820" y1="370" x2="820" y2="460" stroke="#3a3028" stroke-width="1" opacity="0.5"/>
  <line x1="850" y1="362" x2="850" y2="460" stroke="#3a3028" stroke-width="1" opacity="0.5"/>
  <line x1="880" y1="370" x2="880" y2="460" stroke="#3a3028" stroke-width="1" opacity="0.5"/>

  <!-- ===== PENDANT / CEILING LIGHT OVER DESK ===== -->
  <line x1="830" y1="60" x2="830" y2="300" stroke="#8a8078" stroke-width="1.2"/>
  <rect x="810" y="300" width="40" height="18" rx="4" fill="#c8a848"/>
  <rect x="812" y="318" width="36" height="4" rx="1" fill="#a08030" opacity="0.7"/>
  <ellipse cx="830" cy="322" rx="30" ry="8" fill="#fff0c0" opacity="0.08"/>

  <!-- ===== WALL ART / FRAMED PRINT (right panel) ===== -->
  <rect x="790" y="130" width="200" height="140" fill="#e2ddd6" stroke="#b8b4ae" stroke-width="1.5"/>
  <rect x="800" y="140" width="180" height="120" fill="#c8c4bc" opacity="0.5"/>
  <!-- Abstract interior lines in artwork -->
  <line x1="820" y1="160" x2="960" y2="160" stroke="#9a9490" stroke-width="0.8"/>
  <line x1="820" y1="180" x2="920" y2="180" stroke="#9a9490" stroke-width="0.8"/>
  <line x1="820" y1="200" x2="940" y2="200" stroke="#9a9490" stroke-width="0.8"/>
  <rect x="860" y="155" width="60" height="90" fill="#b0aba4" opacity="0.4"/>

  <!-- ===== RED DIMENSION LINES ===== -->
  <!-- Height: 3000mm total -->
  <line x1="30" y1="60" x2="30" y2="460" stroke="#cc2222" stroke-width="1"/>
  <line x1="25" y1="60" x2="35" y2="60" stroke="#cc2222" stroke-width="1"/>
  <line x1="25" y1="460" x2="35" y2="460" stroke="#cc2222" stroke-width="1"/>
  <text x="20" y="265" font-family="Arial,sans-serif" font-size="9" fill="#cc2222" text-anchor="middle" transform="rotate(-90,20,265)">3000</text>

  <!-- Slat panel width: 3800mm -->
  <line x1="50" y1="480" x2="430" y2="480" stroke="#cc2222" stroke-width="1"/>
  <line x1="50" y1="475" x2="50" y2="485" stroke="#cc2222" stroke-width="1"/>
  <line x1="430" y1="475" x2="430" y2="485" stroke="#cc2222" stroke-width="1"/>
  <text x="240" y="496" font-family="Arial,sans-serif" font-size="9" fill="#cc2222" text-anchor="middle">3800</text>

  <!-- Center panel width: 3300mm -->
  <line x1="430" y1="490" x2="760" y2="490" stroke="#cc2222" stroke-width="1"/>
  <line x1="430" y1="485" x2="430" y2="495" stroke="#cc2222" stroke-width="1"/>
  <line x1="760" y1="485" x2="760" y2="495" stroke="#cc2222" stroke-width="1"/>
  <text x="595" y="506" font-family="Arial,sans-serif" font-size="9" fill="#cc2222" text-anchor="middle">3300</text>

  <!-- Desk height marker at 1100mm -->
  <line x1="1060" y1="460" x2="1060" y2="340" stroke="#cc2222" stroke-width="1"/>
  <line x1="1055" y1="340" x2="1065" y2="340" stroke="#cc2222" stroke-width="1"/>
  <line x1="755" y1="340" x2="1062" y2="340" stroke="#cc2222" stroke-width="0.7" stroke-dasharray="4,3"/>
  <text x="1075" y="400" font-family="Arial,sans-serif" font-size="9" fill="#cc2222" text-anchor="middle" transform="rotate(90,1075,400)">1100</text>

  <!-- ===== MATERIAL CALLOUT LABELS ===== -->
  <!-- Slat panel label -->
  <line x1="240" y1="350" x2="240" y2="375" stroke="#555" stroke-width="0.8"/>
  <circle cx="240" cy="350" r="2" fill="#555"/>
  <text x="170" y="390" font-family="Arial,sans-serif" font-size="8" fill="#333" text-anchor="middle">DARK WOOD</text>
  <text x="170" y="400" font-family="Arial,sans-serif" font-size="8" fill="#333" text-anchor="middle">SLAT PANEL</text>

  <!-- Center panel label -->
  <line x1="595" y1="280" x2="640" y2="310" stroke="#555" stroke-width="0.8"/>
  <circle cx="595" cy="280" r="2" fill="#555"/>
  <text x="680" y="305" font-family="Arial,sans-serif" font-size="8" fill="#333" text-anchor="start">BACKLIT FEATURE</text>
  <text x="680" y="315" font-family="Arial,sans-serif" font-size="8" fill="#333" text-anchor="start">PANEL</text>

  <!-- Track lights label -->
  <line x1="490" y1="64" x2="490" y2="90" stroke="#555" stroke-width="0.8"/>
  <circle cx="490" cy="90" r="2" fill="#555"/>
  <text x="520" y="102" font-family="Arial,sans-serif" font-size="8" fill="#333" text-anchor="start">TRACK LIGHTS</text>

  <!-- Reception desk label -->
  <line x1="830" y1="400" x2="730" y2="395" stroke="#555" stroke-width="0.8"/>
  <circle cx="730" cy="395" r="2" fill="#555"/>
  <text x="640" y="390" font-family="Arial,sans-serif" font-size="8" fill="#333" text-anchor="middle">CURVED RECEPTION</text>
  <text x="640" y="400" font-family="Arial,sans-serif" font-size="8" fill="#333" text-anchor="middle">DESK</text>

  <!-- Floor level label -->
  <text x="1040" y="457" font-family="Arial,sans-serif" font-size="8" fill="#333" text-anchor="end">F.F.L. ±0</text>

  <!-- ===== TITLE BLOCK ===== -->
  <text x="550" y="546" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle" letter-spacing="4">ELEVATION B  //  CORPORATE OFFICE  //  RECEPTION FEATURE WALL</text>
  <line x1="200" y1="554" x2="900" y2="554" stroke="#999" stroke-width="0.8"/>
</svg>
