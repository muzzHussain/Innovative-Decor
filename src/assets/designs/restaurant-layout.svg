  <!-- table 1 -->
  <circle cx="335" cy="440" r="32" fill="#222222" stroke="#363636" stroke-width="1.5"/>
  <rect x="314" y="402" width="42" height="14" rx="3" fill="#2a2a2a" stroke="#3c3c3c" stroke-width="1"/>
  <rect x="314" y="468" width="42" height="14" rx="3" fill="#2a2a2a" stroke="#3c3c3c" stroke-width="1"/>
  <rect x="296" y="424" width="14" height="32" rx="3" fill="#2a2a2a" stroke="#3c3c3c" stroke-width="1"/>
  <rect x="360" y="424" width="14" height="32" rx="3" fill="#2a2a2a" stroke="#3c3c3c" stroke-width="1"/>
  <!-- table 2 -->
  <circle cx="466" cy="450" r="32" fill="#222222" stroke="#363636" stroke-width="1.5"/>
  <rect x="445" y="412" width="42" height="14" rx="3" fill="#2a2a2a" stroke="#3c3c3c" stroke-width="1"/>
  <rect x="445" y="478" width="42" height="14" rx="3" fill="#2a2a2a" stroke="#3c3c3c" stroke-width="1"/>
  <rect x="426" y="434" width="14" height="32" rx="3" fill="#2a2a2a" stroke="#3c3c3c" stroke-width="1"/>
  <rect x="492" y="434" width="14" height="32" rx="3" fill="#2a2a2a" stroke="#3c3c3c" stroke-width="1"/>
  <!-- table 3 -->
  <circle cx="335" cy="148" r="28" fill="#222222" stroke="#363636" stroke-width="1.5"/>
  <rect x="316" y="114" width="38" height="14" rx="3" fill="#2a2a2a" stroke="#3c3c3c" stroke-width="1"/>
  <rect x="316" y="168" width="38" height="14" rx="3" fill="#2a2a2a" stroke="#3c3c3c" stroke-width="1"/>
  <rect x="298" y="132" width="14" height="32" rx="3" fill="#2a2a2a" stroke="#3c3c3c" stroke-width="1"/>
  <rect x="356" y="132" width="14" height="32" rx="3" fill="#2a2a2a" stroke="#3c3c3c" stroke-width="1"/>

  <!-- BAR COUNTER -->
  <rect x="645" y="92" width="38" height="476" rx="0" fill="#252525" stroke="#393939" stroke-width="1.5"/>
