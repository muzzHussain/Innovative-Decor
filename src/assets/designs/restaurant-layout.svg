  <line x1="688" y1="156" x2="752" y2="156" stroke="#2e2e2e" stroke-width="1.5"/>
  <line x1="688" y1="220" x2="752" y2="220" stroke="#2e2e2e" stroke-width="1.5"/>
  <line x1="688" y1="284" x2="752" y2="284" stroke="#2e2e2e" stroke-width="1.5"/>
  <line x1="688" y1="348" x2="752" y2="348" stroke="#2e2e2e" stroke-width="1.5"/>
  <line x1="688" y1="412" x2="752" y2="412" stroke="#2e2e2e" stroke-width="1.5"/>
  <line x1="688" y1="476" x2="752" y2="476" stroke="#2e2e2e" stroke-width="1.5"/>

  <!-- door swings -->
  <rect x="284" y="568" width="70" height="10" fill="#111111"/>
  <path d="M 284,572 Q 284,504 350,504" fill="none" stroke="#ccc6bc" stroke-width="1" stroke-dasharray="4,3" opacity="0.65"/>
  <rect x="115" y="380" width="10" height="65" fill="#111111"/>
  <path d="M 120,380 Q 188,380 188,436" fill="none" stroke="#ccc6bc" stroke-width="1" stroke-dasharray="4,3" opacity="0.65"/>

  <!-- LABELS -->
  <text x="32" y="180" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#ccc6bc">Storage Room</text>
  <line x1="118" y1="177" x2="128" y2="172" stroke="#ccc6bc" stroke-width="0.8" stroke-dasharray="3,3"/>
  <circle cx="128" cy="172" r="2.5" fill="#ccc6bc"/>

  <text x="32" y="418" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#ccc6bc">Kitchen Counter</text>
  <line x1="118" y1="415" x2="130" y2="408" stroke="#ccc6bc" stroke-width="0.8" stroke-dasharray="3,3"/>
  <circle cx="130" cy="408" r="2.5" fill="#ccc6bc"/>

  <text x="350" y="68" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#ccc6bc">Dining Table</text>
  <line x1="414" y1="72" x2="466" y2="88" stroke="#ccc6bc" stroke-width="0.8" stroke-dasharray="3,3"/>
  <circle cx="466" cy="88" r="2.5" fill="#ccc6bc"/>

  <text x="635" y="635" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#ccc6bc">Bar Counter</text>
  <line x1="690" y1="630" x2="690" y2="572" stroke="#ccc6bc" stroke-width="0.8" stroke-dasharray="3,3"/>
  <circle cx="690" cy="572" r="2.5" fill="#ccc6bc"/>

  <text x="350" y="635" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#ccc6bc">Island Table</text>
  <line x1="400" y1="630" x2="440" y2="572" stroke="#ccc6bc" stroke-width="0.8" stroke-dasharray="3,3"/>
  <circle cx="440" cy="572" r="2.5" fill="#ccc6bc"/>

  <!-- scale bar -->
  <line x1="130" y1="620" x2="330" y2="620" stroke="#ccc6bc" stroke-width="1.5"/>
  <line x1="130" y1="614" x2="130" y2="626" stroke="#ccc6bc" stroke-width="1.5"/>
  <line x1="230" y1="614" x2="230" y2="626" stroke="#ccc6bc" stroke-width="1.5"/>
  <line x1="330" y1="614" x2="330" y2="626" stroke="#ccc6bc" stroke-width="1.5"/>
  <text x="130" y="638" font-family="Arial,sans-serif" font-size="10" fill="#6a6460" text-anchor="middle">0</text>
  <text x="230" y="638" font-family="Arial,sans-serif" font-size="10" fill="#6a6460" text-anchor="middle">5m</text>
  <text x="330" y="638" font-family="Arial,sans-serif" font-size="10" fill="#6a6460" text-anchor="middle">10m</text>
</svg>
