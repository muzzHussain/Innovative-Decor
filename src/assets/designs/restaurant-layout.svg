  <rect x="352" y="200" width="230" height="100" rx="6" fill="#232323" stroke="#363636" stroke-width="2"/>
  <!-- Chairs around island -->
  <rect x="362" y="182" width="40" height="16" rx="4" fill="#2a2a2a" stroke="#3c3c3c" stroke-width="1"/>
  <rect x="412" y="182" width="40" height="16" rx="4" fill="#2a2a2a" stroke="#3c3c3c" stroke-width="1"/>
  <rect x="462" y="182" width="40" height="16" rx="4" fill="#2a2a2a" stroke="#3c3c3c" stroke-width="1"/>
  <rect x="512" y="182" width="40" height="16" rx="4" fill="#2a2a2a" stroke="#3c3c3c" stroke-width="1"/>
  <rect x="362" y="302" width="40" height="16" rx="4" fill="#2a2a2a" stroke="#3c3c3c" stroke-width="1"/>
  <rect x="412" y="302" width="40" height="16" rx="4" fill="#2a2a2a" stroke="#3c3c3c" stroke-width="1"/>
  <rect x="462" y="302" width="40" height="16" rx="4" fill="#2a2a2a" stroke="#3c3c3c" stroke-width="1"/>
  <rect x="512" y="302" width="40" height="16" rx="4" fill="#2a2a2a" stroke="#3c3c3c" stroke-width="1"/>
  <rect x="334" y="214" width="16" height="72" rx="4" fill="#2a2a2a" stroke="#3c3c3c" stroke-width="1"/>
  <rect x="584" y="214" width="16" height="72" rx="4" fill="#2a2a2a" stroke="#3c3c3c" stroke-width="1"/>

