  <circle cx="632" cy="132" r="11" fill="#222222" stroke="#393939" stroke-width="1.5"/>
  <circle cx="632" cy="174" r="11" fill="#222222" stroke="#393939" stroke-width="1.5"/>
  <circle cx="632" cy="216" r="11" fill="#222222" stroke="#393939" stroke-width="1.5"/>
  <circle cx="632" cy="258" r="11" fill="#222222" stroke="#393939" stroke-width="1.5"/>
  <circle cx="632" cy="300" r="11" fill="#222222" stroke="#393939" stroke-width="1.5"/>
  <circle cx="632" cy="342" r="11" fill="#222222" stroke="#393939" stroke-width="1.5"/>
  <circle cx="632" cy="384" r="11" fill="#222222" stroke="#393939" stroke-width="1.5"/>
  <circle cx="632" cy="426" r="11" fill="#222222" stroke="#393939" stroke-width="1.5"/>
