  <line x1="280" y1="88" x2="280" y2="572" stroke="#ccc6bc" stroke-width="6"/>
  <!-- Bar counter zone (right strip) -->
  <line x1="635" y1="88" x2="635" y2="572" stroke="#ccc6bc" stroke-width="6"/>
  <!-- Storage (top-left corner) -->
  <line x1="120" y1="248" x2="280" y2="248" stroke="#ccc6bc" stroke-width="6"/>

  <!-- fills -->
  <rect x="124" y="92" width="152" height="152" fill="#1a1a1a"/>
  <!-- kitchen open -->
  <rect x="124" y="248" width="152" height="320" fill="#1c1c1c"/>
  <!-- dining area -->
  <rect x="284" y="92" width="347" height="476" fill="#1d1d1d"/>
  <!-- bar -->
  <rect x="639" y="92" width="142" height="476" fill="#1b1b1b"/>

  <!-- STORAGE (top-left) -->
  <rect x="132" y="100" width="130" height="132" rx="3" fill="#181818" stroke="#2a2a2a" stroke-width="1"/>
  <line x1="140" y1="118" x2="254" y2="118" stroke="#242424" stroke-width="1.5"/>
  <line x1="140" y1="140" x2="254" y2="140" stroke="#242424" stroke-width="1.5"/>
  <line x1="140" y1="162" x2="254" y2="162" stroke="#242424" stroke-width="1.5"/>
  <line x1="140" y1="184" x2="254" y2="184" stroke="#242424" stroke-width="1.5"/>
  <line x1="140" y1="206" x2="254" y2="206" stroke="#242424" stroke-width="1.5"/>
  <line x1="140" y1="228" x2="254" y2="228" stroke="#242424" stroke-width="1.5"/>

  <!-- KITCHEN COUNTER L-shape -->
  <rect x="130" y="256" width="140" height="30" rx="2" fill="#262626" stroke="#393939" stroke-width="1.5"/>
  <rect x="130" y="256" width="30" height="260" rx="2" fill="#262626" stroke="#393939" stroke-width="1.5"/>
  <!-- stove -->
  <rect x="145" y="260" width="48" height="26" rx="2" fill="#2c2c2c"/>
  <circle cx="156" cy="267" r="5" fill="none" stroke="#555" stroke-width="1.5"/>
  <circle cx="171" cy="267" r="5" fill="none" stroke="#555" stroke-width="1.5"/>
  <circle cx="156" cy="279" r="5" fill="none" stroke="#555" stroke-width="1.5"/>
  <circle cx="171" cy="279" r="5" fill="none" stroke="#555" stroke-width="1.5"/>
  <!-- sink -->
  <rect x="145" y="300" width="35" height="26" rx="3" fill="#222222"/>
  <circle cx="163" cy="313" r="7" fill="none" stroke="#444" stroke-width="1.5"/>
  <!-- prep station -->
  <rect x="145" y="344" width="120" height="45" rx="3" fill="#252525" stroke="#393939" stroke-width="1.5"/>
  <!-- fridge -->
  <rect x="145" y="502" width="120" height="60" rx="3" fill="#222222" stroke="#393939" stroke-width="1.5"/>
  <line x1="205" y1="502" x2="205" y2="562" stroke="#333" stroke-width="1"/>

