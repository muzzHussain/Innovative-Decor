<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660">
  <rect width="900" height="660" fill="#111111"/>
  <text x="32" y="52" font-family="Georgia,serif" font-size="30" font-weight="bold" fill="#ffffff" letter-spacing="-0.5">Layout.</text>
  <text x="32" y="72" font-family="Arial,sans-serif" font-size="10" fill="#6a6460" letter-spacing="3">RESTAURANT &amp; BAR</text>

  <!-- outer wall -->
  <rect x="120" y="88" width="665" height="484" fill="#1c1c1c" stroke="#ccc6bc" stroke-width="9" stroke-linejoin="miter"/>

