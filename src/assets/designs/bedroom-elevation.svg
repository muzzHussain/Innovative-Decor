<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600">
  <!-- Background -->
  <rect width="1100" height="600" fill="#f4f1ec"/>
  <!-- Outer drawing frame -->
  <rect x="50" y="30" width="1000" height="510" fill="none" stroke="#999" stroke-width="1"/>

  <!-- ===== FLOOR LINE ===== -->
  <line x1="50" y1="460" x2="1050" y2="460" stroke="#333" stroke-width="2"/>

  <!-- ===== CEILING LINE ===== -->
  <line x1="50" y1="60" x2="1050" y2="60" stroke="#333" stroke-width="1.5"/>

  <!-- ===== BACK WALL (warm plaster) ===== -->
  <rect x="50" y="60" width="1000" height="400" fill="#e8e4dc"/>

  <!-- ===== FULL-HEIGHT FLUTED DARK WALNUT FEATURE PANEL (centre, x=200-900) ===== -->
  <rect x="200" y="60" width="700" height="400" fill="#1e1c18"/>
  <!-- Vertical flute lines every 20px -->
  <line x1="220" y1="60" x2="220" y2="460" stroke="#2a2820" stroke-width="1.2"/>
  <line x1="240" y1="60" x2="240" y2="460" stroke="#2a2820" stroke-width="1.2"/>
  <line x1="260" y1="60" x2="260" y2="460" stroke="#2a2820" stroke-width="1.2"/>
  <line x1="280" y1="60" x2="280" y2="460" stroke="#2a2820" stroke-width="1.2"/>
  <line x1="300" y1="60" x2="300" y2="460" stroke="#2a2820" stroke-width="1.2"/>
  <line x1="320" y1="60" x2="320" y2="460" stroke="#2a2820" stroke-width="1.2"/>
  <line x1="340" y1="60" x2="340" y2="460" stroke="#2a2820" stroke-width="1.2"/>
  <line x1="360" y1="60" x2="360" y2="460" stroke="#2a2820" stroke-width="1.2"/>
  <line x1="380" y1="60" x2="380" y2="460" stroke="#2a2820" stroke-width="1.2"/>
  <line x1="400" y1="60" x2="400" y2="460" stroke="#2a2820" stroke-width="1.2"/>
  <line x1="420" y1="60" x2="420" y2="460" stroke="#2a2820" stroke-width="1.2"/>
  <line x1="440" y1="60" x2="440" y2="460" stroke="#2a2820" stroke-width="1.2"/>
  <line x1="460" y1="60" x2="460" y2="460" stroke="#2a2820" stroke-width="1.2"/>
  <line x1="480" y1="60" x2="480" y2="460" stroke="#2a2820" stroke-width="1.2"/>
  <line x1="500" y1="60" x2="500" y2="460" stroke="#2a2820" stroke-width="1.2"/>
  <line x1="520" y1="60" x2="520" y2="460" stroke="#2a2820" stroke-width="1.2"/>
  <line x1="540" y1="60" x2="540" y2="460" stroke="#2a2820" stroke-width="1.2"/>
  <line x1="560" y1="60" x2="560" y2="460" stroke="#2a2820" stroke-width="1.2"/>
  <line x1="580" y1="60" x2="580" y2="460" stroke="#2a2820" stroke-width="1.2"/>
  <line x1="600" y1="60" x2="600" y2="460" stroke="#2a2820" stroke-width="1.2"/>
  <line x1="620" y1="60" x2="620" y2="460" stroke="#2a2820" stroke-width="1.2"/>
  <line x1="640" y1="60" x2="640" y2="460" stroke="#2a2820" stroke-width="1.2"/>
  <line x1="660" y1="60" x2="660" y2="460" stroke="#2a2820" stroke-width="1.2"/>
  <line x1="680" y1="60" x2="680" y2="460" stroke="#2a2820" stroke-width="1.2"/>
  <line x1="700" y1="60" x2="700" y2="460" stroke="#2a2820" stroke-width="1.2"/>
  <line x1="720" y1="60" x2="720" y2="460" stroke="#2a2820" stroke-width="1.2"/>
  <line x1="740" y1="60" x2="740" y2="460" stroke="#2a2820" stroke-width="1.2"/>
  <line x1="760" y1="60" x2="760" y2="460" stroke="#2a2820" stroke-width="1.2"/>
  <line x1="780" y1="60" x2="780" y2="460" stroke="#2a2820" stroke-width="1.2"/>
  <line x1="800" y1="60" x2="800" y2="460" stroke="#2a2820" stroke-width="1.2"/>
  <line x1="820" y1="60" x2="820" y2="460" stroke="#2a2820" stroke-width="1.2"/>
  <line x1="840" y1="60" x2="840" y2="460" stroke="#2a2820" stroke-width="1.2"/>
  <line x1="860" y1="60" x2="860" y2="460" stroke="#2a2820" stroke-width="1.2"/>
  <line x1="880" y1="60" x2="880" y2="460" stroke="#2a2820" stroke-width="1.2"/>

  <!-- Amber LED reveal strip at top of panel -->
  <rect x="200" y="60" width="700" height="8" fill="#c8a030" opacity="0.4"/>
  <!-- Amber LED strip at floor level bottom of panel -->
  <rect x="200" y="452" width="700" height="6" fill="#c8a030" opacity="0.3"/>

  <!-- ===== UPHOLSTERED HEADBOARD (centre of panel, x=300-800, y=220-420) ===== -->
  <!-- Headboard outer frame (deep charcoal velvet) -->
  <rect x="300" y="220" width="500" height="200" rx="6" fill="#2a2830"/>
  <!-- Headboard inner padded area -->
  <rect x="314" y="232" width="472" height="176" rx="4" fill="#322e40"/>
  <!-- Tufting button grid (5 cols x 4 rows) -->
  <!-- Row 1 y=258 -->
  <circle cx="400" cy="258" r="5" fill="#1e1c28" stroke="#4a4660" stroke-width="1"/>
  <circle cx="475" cy="258" r="5" fill="#1e1c28" stroke="#4a4660" stroke-width="1"/>
  <circle cx="550" cy="258" r="5" fill="#1e1c28" stroke="#4a4660" stroke-width="1"/>
  <circle cx="625" cy="258" r="5" fill="#1e1c28" stroke="#4a4660" stroke-width="1"/>
  <circle cx="700" cy="258" r="5" fill="#1e1c28" stroke="#4a4660" stroke-width="1"/>
  <!-- Row 2 y=302 -->
  <circle cx="400" cy="302" r="5" fill="#1e1c28" stroke="#4a4660" stroke-width="1"/>
  <circle cx="475" cy="302" r="5" fill="#1e1c28" stroke="#4a4660" stroke-width="1"/>
  <circle cx="550" cy="302" r="5" fill="#1e1c28" stroke="#4a4660" stroke-width="1"/>
  <circle cx="625" cy="302" r="5" fill="#1e1c28" stroke="#4a4660" stroke-width="1"/>
  <circle cx="700" cy="302" r="5" fill="#1e1c28" stroke="#4a4660" stroke-width="1"/>
  <!-- Row 3 y=346 -->
  <circle cx="400" cy="346" r="5" fill="#1e1c28" stroke="#4a4660" stroke-width="1"/>
  <circle cx="475" cy="346" r="5" fill="#1e1c28" stroke="#4a4660" stroke-width="1"/>
  <circle cx="550" cy="346" r="5" fill="#1e1c28" stroke="#4a4660" stroke-width="1"/>
  <circle cx="625" cy="346" r="5" fill="#1e1c28" stroke="#4a4660" stroke-width="1"/>
  <circle cx="700" cy="346" r="5" fill="#1e1c28" stroke="#4a4660" stroke-width="1"/>
  <!-- Row 4 y=390 -->
  <circle cx="400" cy="390" r="5" fill="#1e1c28" stroke="#4a4660" stroke-width="1"/>
  <circle cx="475" cy="390" r="5" fill="#1e1c28" stroke="#4a4660" stroke-width="1"/>
  <circle cx="550" cy="390" r="5" fill="#1e1c28" stroke="#4a4660" stroke-width="1"/>
  <circle cx="625" cy="390" r="5" fill="#1e1c28" stroke="#4a4660" stroke-width="1"/>
  <circle cx="700" cy="390" r="5" fill="#1e1c28" stroke="#4a4660" stroke-width="1"/>
  <!-- Tufting diagonal pull-lines -->
  <line x1="400" y1="258" x2="475" y2="302" stroke="#3a364a" stroke-width="0.6" opacity="0.5"/>
  <line x1="475" y1="258" x2="550" y2="302" stroke="#3a364a" stroke-width="0.6" opacity="0.5"/>
  <line x1="550" y1="258" x2="625" y2="302" stroke="#3a364a" stroke-width="0.6" opacity="0.5"/>
  <line x1="625" y1="258" x2="700" y2="302" stroke="#3a364a" stroke-width="0.6" opacity="0.5"/>

  <!-- ===== BEDSIDE TABLE LEFT (x=50-200, floor) ===== -->
  <rect x="80" y="390" width="120" height="70" fill="#3a3428" stroke="#2a2820" stroke-width="1"/>
  <!-- Table top stone surface -->
  <rect x="76" y="386" width="128" height="8" fill="#c0b8a8"/>
  <!-- Drawer line -->
  <line x1="80" y1="420" x2="200" y2="420" stroke="#2a2820" stroke-width="1"/>
  <!-- Table top lamp base -->
  <rect x="126" y="368" width="18" height="20" rx="3" fill="#8a8070"/>
  <!-- Lamp shade -->
  <polygon points="115,340 201,340 195,368 131,368" fill="#d4c8a0" opacity="0.9"/>
  <!-- Lamp glow -->
  <ellipse cx="155" cy="342" rx="40" ry="10" fill="#fff8e0" opacity="0.12"/>

  <!-- ===== BEDSIDE TABLE RIGHT (x=900-1050, floor) ===== -->
  <rect x="900" y="390" width="120" height="70" fill="#3a3428" stroke="#2a2820" stroke-width="1"/>
  <!-- Table top stone surface -->
  <rect x="896" y="386" width="128" height="8" fill="#c0b8a8"/>
  <!-- Drawer line -->
  <line x1="900" y1="420" x2="1020" y2="420" stroke="#2a2820" stroke-width="1"/>
  <!-- Lamp base -->
  <rect x="956" y="368" width="18" height="20" rx="3" fill="#8a8070"/>
  <!-- Lamp shade -->
  <polygon points="945,340 1031,340 1025,368 951,368" fill="#d4c8a0" opacity="0.9"/>
  <!-- Lamp glow -->
  <ellipse cx="972" cy="342" rx="40" ry="10" fill="#fff8e0" opacity="0.12"/>

  <!-- ===== CROWN MOLDING at ceiling ===== -->
  <rect x="50" y="60" width="1000" height="14" fill="#cac4bc"/>
  <rect x="50" y="70" width="1000" height="4" fill="#b8b2aa"/>

  <!-- ===== WALL SCONCES (on side walls, left x=80, right x=1020) ===== -->
  <!-- Left sconce -->
  <rect x="68" y="230" width="24" height="40" rx="4" fill="#9a9080"/>
  <polygon points="56,230 92,230 100,200 48,200" fill="#d4c8a0" opacity="0.85"/>
  <ellipse cx="80" cy="202" rx="28" ry="8" fill="#fff8e0" opacity="0.1"/>
  <!-- Right sconce -->
  <rect x="1008" y="230" width="24" height="40" rx="4" fill="#9a9080"/>
  <polygon points="1000,230 1044,230 1052,200 996,200" fill="#d4c8a0" opacity="0.85"/>
  <ellipse cx="1020" cy="202" rx="28" ry="8" fill="#fff8e0" opacity="0.1"/>

  <!-- ===== PENDANT LIGHT (ceiling centre) ===== -->
  <line x1="550" y1="60" x2="550" y2="160" stroke="#8a8078" stroke-width="1.2"/>
  <rect x="524" y="160" width="52" height="24" rx="6" fill="#c8a848"/>
  <rect x="526" y="184" width="48" height="5" rx="1" fill="#a08030" opacity="0.7"/>
  <ellipse cx="550" cy="189" rx="38" ry="10" fill="#fff0c0" opacity="0.1"/>

  <!-- ===== RED DIMENSION LINES ===== -->
  <!-- Total height 3000mm -->
  <line x1="30" y1="60" x2="30" y2="460" stroke="#cc2222" stroke-width="1"/>
  <line x1="25" y1="60" x2="35" y2="60" stroke="#cc2222" stroke-width="1"/>
  <line x1="25" y1="460" x2="35" y2="460" stroke="#cc2222" stroke-width="1"/>
  <text x="20" y="265" font-family="Arial,sans-serif" font-size="9" fill="#cc2222" text-anchor="middle" transform="rotate(-90,20,265)">3000</text>

  <!-- Feature panel width: 7000mm -->
  <line x1="200" y1="480" x2="900" y2="480" stroke="#cc2222" stroke-width="1"/>
  <line x1="200" y1="475" x2="200" y2="485" stroke="#cc2222" stroke-width="1"/>
  <line x1="900" y1="475" x2="900" y2="485" stroke="#cc2222" stroke-width="1"/>
  <text x="550" y="496" font-family="Arial,sans-serif" font-size="9" fill="#cc2222" text-anchor="middle">7000</text>

  <!-- Headboard height: 2000mm from floor (y=220) -->
  <line x1="1060" y1="220" x2="1060" y2="460" stroke="#cc2222" stroke-width="1"/>
  <line x1="1055" y1="220" x2="1065" y2="220" stroke="#cc2222" stroke-width="1"/>
  <line x1="1055" y1="460" x2="1065" y2="460" stroke="#cc2222" stroke-width="1"/>
  <line x1="800" y1="220" x2="1062" y2="220" stroke="#cc2222" stroke-width="0.7" stroke-dasharray="4,3"/>
  <text x="1075" y="340" font-family="Arial,sans-serif" font-size="9" fill="#cc2222" text-anchor="middle" transform="rotate(90,1075,340)">2000</text>

  <!-- Sconce height at 2300mm (y=154) -->
  <line x1="30" y1="154" x2="70" y2="154" stroke="#cc2222" stroke-width="0.7" stroke-dasharray="4,3"/>
  <text x="20" y="150" font-family="Arial,sans-serif" font-size="8" fill="#cc2222" text-anchor="middle">2300</text>

  <!-- ===== MATERIAL CALLOUT LABELS ===== -->
  <!-- Fluted panel -->
  <line x1="550" y1="140" x2="580" y2="115" stroke="#555" stroke-width="0.8"/>
  <circle cx="580" cy="115" r="2" fill="#555"/>
  <text x="650" y="110" font-family="Arial,sans-serif" font-size="8" fill="#333" text-anchor="start">FL. WALNUT</text>
  <text x="650" y="120" font-family="Arial,sans-serif" font-size="8" fill="#333" text-anchor="start">FLUTED PANEL</text>

  <!-- Headboard -->
  <line x1="550" y1="320" x2="512" y2="340" stroke="#555" stroke-width="0.8"/>
  <circle cx="512" cy="340" r="2" fill="#555"/>
  <text x="380" y="345" font-family="Arial,sans-serif" font-size="8" fill="#333" text-anchor="middle">UPHOLSTERED</text>
  <text x="380" y="355" font-family="Arial,sans-serif" font-size="8" fill="#333" text-anchor="middle">HEADBOARD</text>

  <!-- Bedside lamp left -->
  <line x1="155" y1="355" x2="140" y2="340" stroke="#555" stroke-width="0.8"/>
  <circle cx="140" cy="340" r="2" fill="#555"/>
  <text x="100" y="332" font-family="Arial,sans-serif" font-size="8" fill="#333" text-anchor="middle">TABLE LAMP</text>

  <!-- Crown molding -->
  <line x1="700" y1="67" x2="730" y2="50" stroke="#555" stroke-width="0.8"/>
  <circle cx="730" cy="50" r="2" fill="#555"/>
  <text x="800" y="46" font-family="Arial,sans-serif" font-size="8" fill="#333" text-anchor="start">CROWN MOLDING</text>

  <!-- Floor label -->
  <text x="1040" y="457" font-family="Arial,sans-serif" font-size="8" fill="#333" text-anchor="end">F.F.L. ±0</text>

  <!-- ===== TITLE BLOCK ===== -->
  <text x="550" y="546" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle" letter-spacing="4">ELEVATION D  //  MASTER BEDROOM  //  HEADBOARD FEATURE WALL</text>
  <line x1="200" y1="554" x2="900" y2="554" stroke="#999" stroke-width="0.8"/>
</svg>
