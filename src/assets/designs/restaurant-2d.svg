  <circle cx="625" cy="174" r="11" fill="none" stroke="#777" stroke-width="1"/>
  <circle cx="625" cy="218" r="11" fill="none" stroke="#777" stroke-width="1"/>
  <circle cx="625" cy="262" r="11" fill="none" stroke="#777" stroke-width="1"/>
  <circle cx="625" cy="306" r="11" fill="none" stroke="#777" stroke-width="1"/>
  <circle cx="625" cy="350" r="11" fill="none" stroke="#777" stroke-width="1"/>
  <circle cx="625" cy="394" r="11" fill="none" stroke="#777" stroke-width="1"/>
  <circle cx="625" cy="438" r="11" fill="none" stroke="#777" stroke-width="1"/>
  <circle cx="625" cy="482" r="11" fill="none" stroke="#777" stroke-width="1"/>
  <circle cx="625" cy="526" r="11" fill="none" stroke="#777" stroke-width="1"/>

