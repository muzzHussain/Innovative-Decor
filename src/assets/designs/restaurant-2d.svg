<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660">
  <defs>
    <pattern id="hatch2" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#333" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect width="900" height="660" fill="#ffffff"/>
  <rect x="0" y="0" width="900" height="660" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="10" y="10" width="880" height="640" fill="none" stroke="#1a1a1a" stroke-width="0.5"/>
  <text x="450" y="635" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle" letter-spacing="3">RESTAURANT &amp; BAR  //  ARCHITECTURAL FLOOR PLAN  //  SCALE 1:50</text>
  <text x="450" y="52" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">FLOOR PLAN</text>
  <line x1="350" y1="56" x2="550" y2="56" stroke="#1a1a1a" stroke-width="0.8"/>

  <!-- OUTER WALLS -->
  <rect x="120" y="85" width="670" height="14" fill="url(#hatch2)" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="120" y="573" width="670" height="14" fill="url(#hatch2)" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="120" y="85" width="14" height="502" fill="url(#hatch2)" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="776" y="85" width="14" height="502" fill="url(#hatch2)" stroke="#1a1a1a" stroke-width="1"/>

  <!-- INTERNAL WALLS -->
  <!-- Kitchen zone -->
  <rect x="272" y="85" width="10" height="502" fill="url(#hatch2)" stroke="#1a1a1a" stroke-width="0.8"/>
  <!-- Storage wall -->
  <rect x="120" y="240" width="162" height="10" fill="url(#hatch2)" stroke="#1a1a1a" stroke-width="0.8"/>
  <!-- Bar zone -->
  <rect x="628" y="85" width="10" height="502" fill="url(#hatch2)" stroke="#1a1a1a" stroke-width="0.8"/>

  <!-- ROOM LABELS -->
  <text x="196" y="170" font-family="Arial,sans-serif" font-size="10" fill="#333" text-anchor="middle">Storage</text>
  <text x="196" y="415" font-family="Arial,sans-serif" font-size="10" fill="#333" text-anchor="middle">Kitchen</text>
  <text x="450" y="338" font-family="Arial,sans-serif" font-size="11" fill="#333" text-anchor="middle">Dining Area</text>
  <text x="703" y="338" font-family="Arial,sans-serif" font-size="11" fill="#333" text-anchor="middle">Bar</text>

  <!-- TABLES (dining area) - circles with chairs -->
  <!-- Island table -->
  <rect x="344" y="218" width="236" height="102" rx="6" fill="none" stroke="#555" stroke-width="1.5"/>
  <!-- Chairs around island (top) -->
  <rect x="354" y="205" width="38" height="12" rx="3" fill="none" stroke="#777" stroke-width="1"/>
  <rect x="401" y="205" width="38" height="12" rx="3" fill="none" stroke="#777" stroke-width="1"/>
  <rect x="448" y="205" width="38" height="12" rx="3" fill="none" stroke="#777" stroke-width="1"/>
  <rect x="495" y="205" width="38" height="12" rx="3" fill="none" stroke="#777" stroke-width="1"/>
  <rect x="354" y="322" width="38" height="12" rx="3" fill="none" stroke="#777" stroke-width="1"/>
  <rect x="401" y="322" width="38" height="12" rx="3" fill="none" stroke="#777" stroke-width="1"/>
  <rect x="448" y="322" width="38" height="12" rx="3" fill="none" stroke="#777" stroke-width="1"/>
  <rect x="495" y="322" width="38" height="12" rx="3" fill="none" stroke="#777" stroke-width="1"/>
  <rect x="330" y="228" width="12" height="72" rx="3" fill="none" stroke="#777" stroke-width="1"/>
  <rect x="582" y="228" width="12" height="72" rx="3" fill="none" stroke="#777" stroke-width="1"/>

