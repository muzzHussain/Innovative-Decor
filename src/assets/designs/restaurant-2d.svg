  <circle cx="330" cy="448" r="34" fill="none" stroke="#555" stroke-width="1.5"/>
  <rect x="309" y="408" width="42" height="12" rx="3" fill="none" stroke="#777" stroke-width="1"/>
  <rect x="309" y="478" width="42" height="12" rx="3" fill="none" stroke="#777" stroke-width="1"/>
  <rect x="290" y="430" width="12" height="36" rx="3" fill="none" stroke="#777" stroke-width="1"/>
  <rect x="364" y="430" width="12" height="36" rx="3" fill="none" stroke="#777" stroke-width="1"/>

  <circle cx="468" cy="448" r="34" fill="none" stroke="#555" stroke-width="1.5"/>
  <rect x="447" y="408" width="42" height="12" rx="3" fill="none" stroke="#777" stroke-width="1"/>
  <rect x="447" y="478" width="42" height="12" rx="3" fill="none" stroke="#777" stroke-width="1"/>
  <rect x="428" y="430" width="12" height="36" rx="3" fill="none" stroke="#777" stroke-width="1"/>
  <rect x="502" y="430" width="12" height="36" rx="3" fill="none" stroke="#777" stroke-width="1"/>

  <circle cx="330" cy="148" r="28" fill="none" stroke="#555" stroke-width="1.5"/>
  <rect x="312" y="114" width="36" height="12" rx="3" fill="none" stroke="#777" stroke-width="1"/>
  <rect x="312" y="170" width="36" height="12" rx="3" fill="none" stroke="#777" stroke-width="1"/>
  <rect x="294" y="130" width="12" height="36" rx="3" fill="none" stroke="#777" stroke-width="1"/>
  <rect x="358" y="130" width="12" height="36" rx="3" fill="none" stroke="#777" stroke-width="1"/>

