  <!-- Main entrance -->
  <line x1="282" y1="573" x2="346" y2="573" stroke="#ffffff" stroke-width="10"/>
  <path d="M 282,573 Q 282,511 344,511" fill="none" stroke="#1a1a1a" stroke-width="0.8" stroke-dasharray="4,2"/>
  <line x1="282" y1="573" x2="344" y2="573" stroke="#1a1a1a" stroke-width="0.8"/>
  <!-- Kitchen door -->
  <line x1="120" y1="375" x2="120" y2="432" stroke="#ffffff" stroke-width="10"/>
  <path d="M 127,375 Q 185,375 185,432" fill="none" stroke="#1a1a1a" stroke-width="0.8" stroke-dasharray="4,2"/>
  <line x1="127" y1="375" x2="127" y2="432" stroke="#1a1a1a" stroke-width="0.8"/>

  <!-- DIMENSION LINES -->
  <line x1="120" y1="72" x2="790" y2="72" stroke="#1a1a1a" stroke-width="0.8"/>
  <polygon points="124,72 120,68 120,76" fill="#1a1a1a"/>
  <polygon points="786,72 790,68 790,76" fill="#1a1a1a"/>
  <line x1="120" y1="65" x2="120" y2="80" stroke="#1a1a1a" stroke-width="0.8"/>
  <line x1="790" y1="65" x2="790" y2="80" stroke="#1a1a1a" stroke-width="0.8"/>
  <text x="455" y="68" font-family="Arial,sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">13500 mm</text>

  <line x1="806" y1="85" x2="806" y2="587" stroke="#1a1a1a" stroke-width="0.8"/>
  <polygon points="806,89 802,85 810,85" fill="#1a1a1a"/>
  <polygon points="806,583 802,587 810,587" fill="#1a1a1a"/>
  <line x1="799" y1="85" x2="814" y2="85" stroke="#1a1a1a" stroke-width="0.8"/>
  <line x1="799" y1="587" x2="814" y2="587" stroke="#1a1a1a" stroke-width="0.8"/>
  <text x="824" y="340" font-family="Arial,sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" transform="rotate(90,824,340)">9700 mm</text>

  <!-- Kitchen width -->
  <line x1="134" y1="606" x2="278" y2="606" stroke="#1a1a1a" stroke-width="0.8"/>
  <polygon points="138,606 134,602 134,610" fill="#1a1a1a"/>
  <polygon points="274,606 278,602 278,610" fill="#1a1a1a"/>
  <text x="206" y="602" font-family="Arial,sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">3000 mm</text>

  <!-- Dining width -->
  <line x1="286" y1="606" x2="634" y2="606" stroke="#1a1a1a" stroke-width="0.8"/>
  <polygon points="290,606 286,602 286,610" fill="#1a1a1a"/>
  <polygon points="630,606 634,602 634,610" fill="#1a1a1a"/>
  <text x="460" y="602" font-family="Arial,sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">7000 mm</text>

  <!-- Bar width -->
  <line x1="638" y1="606" x2="790" y2="606" stroke="#1a1a1a" stroke-width="0.8"/>
  <polygon points="642,606 638,602 638,610" fill="#1a1a1a"/>
  <polygon points="786,606 790,602 790,610" fill="#1a1a1a"/>
  <text x="714" y="602" font-family="Arial,sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">3000 mm</text>

  <!-- scale bar -->
  <line x1="20" y1="622" x2="120" y2="622" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="20" y="618" width="50" height="4" fill="#1a1a1a"/>
  <rect x="70" y="618" width="50" height="4" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  <text x="20" y="616" font-family="Arial,sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">0</text>
  <text x="70" y="616" font-family="Arial,sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">2.5m</text>
  <text x="120" y="616" font-family="Arial,sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">5m</text>
</svg>
