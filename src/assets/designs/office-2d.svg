  <polygon points="551,606 547,602 547,610" fill="#1a1a1a"/>
  <polygon points="791,606 795,602 795,610" fill="#1a1a1a"/>
  <text x="671" y="602" font-family="Arial,sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">4960 mm</text>

