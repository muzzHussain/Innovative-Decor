  <text x="413" y="210" font-family="Arial,sans-serif" font-size="10" fill="#333" text-anchor="middle">Open Workstations</text>
  <text x="660" y="195" font-family="Arial,sans-serif" font-size="10" fill="#333" text-anchor="middle">Conference</text>
