<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660">
  <defs>
    <pattern id="hatch3" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#333" stroke-width="1.5"/>
