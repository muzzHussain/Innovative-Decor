  <rect x="138" y="164" width="64" height="40" rx="4" fill="#252525" stroke="#383838" stroke-width="1.5"/>
  <!-- chair -->
  <circle cx="195" cy="200" r="18" fill="#222222" stroke="#363636" stroke-width="1.5"/>
  <!-- side chairs -->
  <rect x="140" y="110" width="40" height="16" rx="3" fill="#2a2a2a" stroke="#3c3c3c" stroke-width="1"/>
  <rect x="225" y="110" width="40" height="16" rx="3" fill="#2a2a2a" stroke="#3c3c3c" stroke-width="1"/>
  <!-- bookshelf -->
