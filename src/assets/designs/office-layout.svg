  <line x1="540" y1="300" x2="790" y2="300" stroke="#ccc6bc" stroke-width="6"/>
  <!-- Manager cabin (top-left) -->
  <line x1="120" y1="88" x2="120" y2="300" stroke="#ccc6bc" stroke-width="0"/>
  <line x1="290" y1="88" x2="290" y2="300" stroke="#ccc6bc" stroke-width="6"/>
  <line x1="290" y1="300" x2="120" y2="300" stroke="#ccc6bc" stroke-width="6"/>

  <!-- fills -->
  <rect x="124" y="92" width="162" height="204" fill="#1a1a1a"/>
  <rect x="290" y="92" width="246" height="352" fill="#1d1d1d"/>
  <rect x="544" y="92" width="242" height="204" fill="#1b1b1b"/>
