  <circle cx="665" cy="366" r="36" fill="#222222" stroke="#363636" stroke-width="1.5"/>
  <rect x="640" y="324" width="50" height="14" rx="3" fill="#2a2a2a" stroke="#3c3c3c" stroke-width="1"/>
  <rect x="640" y="394" width="50" height="14" rx="3" fill="#2a2a2a" stroke="#3c3c3c" stroke-width="1"/>
  <rect x="622" y="348" width="14" height="36" rx="3" fill="#2a2a2a" stroke="#3c3c3c" stroke-width="1"/>
  <rect x="694" y="348" width="14" height="36" rx="3" fill="#2a2a2a" stroke="#3c3c3c" stroke-width="1"/>

