  <rect x="310" y="466" width="290" height="88" rx="6" fill="#252525" stroke="#383838" stroke-width="2"/>
  <rect x="310" y="466" width="290" height="18" rx="5" fill="#2d2d2d" stroke="#3c3c3c" stroke-width="1"/>
