  <rect x="306" y="108" width="100" height="60" rx="3" fill="#252525" stroke="#383838" stroke-width="1.5"/>
  <rect x="420" y="108" width="100" height="60" rx="3" fill="#252525" stroke="#383838" stroke-width="1.5"/>
  <rect x="306" y="178" width="100" height="60" rx="3" fill="#252525" stroke="#383838" stroke-width="1.5"/>
  <rect x="420" y="178" width="100" height="60" rx="3" fill="#252525" stroke="#383838" stroke-width="1.5"/>
