  <rect x="578" y="102" width="30" height="14" rx="3" fill="#2a2a2a" stroke="#3c3c3c" stroke-width="1"/>
  <rect x="618" y="102" width="30" height="14" rx="3" fill="#2a2a2a" stroke="#3c3c3c" stroke-width="1"/>
  <rect x="658" y="102" width="30" height="14" rx="3" fill="#2a2a2a" stroke="#3c3c3c" stroke-width="1"/>
  <rect x="698" y="102" width="30" height="14" rx="3" fill="#2a2a2a" stroke="#3c3c3c" stroke-width="1"/>
  <rect x="578" y="250" width="30" height="14" rx="3" fill="#2a2a2a" stroke="#3c3c3c" stroke-width="1"/>
  <rect x="618" y="250" width="30" height="14" rx="3" fill="#2a2a2a" stroke="#3c3c3c" stroke-width="1"/>
  <rect x="658" y="250" width="30" height="14" rx="3" fill="#2a2a2a" stroke="#3c3c3c" stroke-width="1"/>
  <rect x="698" y="250" width="30" height="14" rx="3" fill="#2a2a2a" stroke="#3c3c3c" stroke-width="1"/>
  <rect x="552" y="132" width="14" height="30" rx="3" fill="#2a2a2a" stroke="#3c3c3c" stroke-width="1"/>
  <rect x="552" y="172" width="14" height="30" rx="3" fill="#2a2a2a" stroke="#3c3c3c" stroke-width="1"/>
  <rect x="762" y="132" width="14" height="30" rx="3" fill="#2a2a2a" stroke="#3c3c3c" stroke-width="1"/>
  <rect x="762" y="172" width="14" height="30" rx="3" fill="#2a2a2a" stroke="#3c3c3c" stroke-width="1"/>
