  <circle cx="178" cy="496" r="20" fill="#232323" stroke="#363636" stroke-width="1.5"/>
  <circle cx="238" cy="496" r="20" fill="#232323" stroke="#363636" stroke-width="1.5"/>
  <circle cx="672" cy="496" r="20" fill="#232323" stroke="#363636" stroke-width="1.5"/>
  <circle cx="732" cy="496" r="20" fill="#232323" stroke="#363636" stroke-width="1.5"/>

  <!-- door swings -->
  <rect x="220" y="296" width="68" height="9" fill="#111111"/>
  <path d="M 220,300 Q 220,242 282,242" fill="none" stroke="#ccc6bc" stroke-width="1" stroke-dasharray="4,3" opacity="0.65"/>
  <rect x="115" y="380" width="10" height="65" fill="#111111"/>
  <path d="M 120,380 Q 188,380 188,438" fill="none" stroke="#ccc6bc" stroke-width="1" stroke-dasharray="4,3" opacity="0.65"/>
  <rect x="536" y="178" width="9" height="68" fill="#111111"/>
  <path d="M 540,178 Q 608,178 608,240" fill="none" stroke="#ccc6bc" stroke-width="1" stroke-dasharray="4,3" opacity="0.65"/>
  <rect x="454" y="444" width="72" height="9" fill="#111111"/>
  <path d="M 454,448 Q 454,386 520,386" fill="none" stroke="#ccc6bc" stroke-width="1" stroke-dasharray="4,3" opacity="0.65"/>

  <!-- LABELS -->
  <text x="32" y="196" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#ccc6bc">Manager Cabin</text>
  <line x1="118" y1="193" x2="128" y2="188" stroke="#ccc6bc" stroke-width="0.8" stroke-dasharray="3,3"/>
  <circle cx="128" cy="188" r="2.5" fill="#ccc6bc"/>

  <text x="32" y="352" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#ccc6bc">Server Room</text>
  <line x1="118" y1="349" x2="130" y2="342" stroke="#ccc6bc" stroke-width="0.8" stroke-dasharray="3,3"/>
  <circle cx="130" cy="342" r="2.5" fill="#ccc6bc"/>

  <text x="330" y="68" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#ccc6bc">Workstations</text>
  <line x1="396" y1="72" x2="430" y2="88" stroke="#ccc6bc" stroke-width="0.8" stroke-dasharray="3,3"/>
  <circle cx="430" cy="88" r="2.5" fill="#ccc6bc"/>

  <text x="580" y="68" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#ccc6bc">Conference Room</text>
  <line x1="665" y1="72" x2="665" y2="88" stroke="#ccc6bc" stroke-width="0.8" stroke-dasharray="3,3"/>
  <circle cx="665" cy="88" r="2.5" fill="#ccc6bc"/>

  <text x="796" y="366" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#ccc6bc">Breakout</text>
  <line x1="794" y1="363" x2="778" y2="358" stroke="#ccc6bc" stroke-width="0.8" stroke-dasharray="3,3"/>
  <circle cx="778" cy="358" r="2.5" fill="#ccc6bc"/>

  <text x="396" y="635" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#ccc6bc">Reception Area</text>
  <line x1="455" y1="630" x2="455" y2="572" stroke="#ccc6bc" stroke-width="0.8" stroke-dasharray="3,3"/>
  <circle cx="455" cy="572" r="2.5" fill="#ccc6bc"/>

  <!-- scale bar -->
  <line x1="130" y1="620" x2="330" y2="620" stroke="#ccc6bc" stroke-width="1.5"/>
  <line x1="130" y1="614" x2="130" y2="626" stroke="#ccc6bc" stroke-width="1.5"/>
  <line x1="230" y1="614" x2="230" y2="626" stroke="#ccc6bc" stroke-width="1.5"/>
  <line x1="330" y1="614" x2="330" y2="626" stroke="#ccc6bc" stroke-width="1.5"/>
  <text x="130" y="638" font-family="Arial,sans-serif" font-size="10" fill="#6a6460" text-anchor="middle">0</text>
  <text x="230" y="638" font-family="Arial,sans-serif" font-size="10" fill="#6a6460" text-anchor="middle">5m</text>
  <text x="330" y="638" font-family="Arial,sans-serif" font-size="10" fill="#6a6460" text-anchor="middle">10m</text>
</svg>
