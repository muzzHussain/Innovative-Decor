<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660">
  <rect width="900" height="660" fill="#111111"/>
  <text x="32" y="52" font-family="Georgia,serif" font-size="30" font-weight="bold" fill="#ffffff" letter-spacing="-0.5">Layout.</text>
  <text x="32" y="72" font-family="Arial,sans-serif" font-size="10" fill="#6a6460" letter-spacing="3">LUXURY APARTMENT</text>

  <!-- outer wall -->
  <rect x="145" y="88" width="635" height="494" fill="#1c1c1c" stroke="#ccc6bc" stroke-width="9" stroke-linejoin="miter"/>

  <!-- internal dividers -->
  <!-- vertical: living | rest -->
  <line x1="385" y1="88" x2="385" y2="582" stroke="#ccc6bc" stroke-width="6"/>
  <!-- horizontal: top rooms | lower -->
  <line x1="385" y1="278" x2="780" y2="278" stroke="#ccc6bc" stroke-width="6"/>
  <!-- vertical: kitchen | bathroom -->
  <line x1="585" y1="88" x2="585" y2="278" stroke="#ccc6bc" stroke-width="6"/>
  <!-- horizontal: foyer | bedroom -->
  <line x1="385" y1="418" x2="780" y2="418" stroke="#ccc6bc" stroke-width="6"/>
  <!-- vertical: foyer | wardrobe -->
  <line x1="585" y1="278" x2="585" y2="418" stroke="#ccc6bc" stroke-width="6"/>

  <!-- room fills -->
  <rect x="149" y="92" width="232" height="486" fill="#1e1e1e"/>
  <rect x="389" y="92" width="192" height="182" fill="#1c1c1c"/>
  <rect x="589" y="92" width="187" height="182" fill="#1b1b1b"/>
  <rect x="389" y="282" width="192" height="132" fill="#1d1d1d"/>
  <rect x="589" y="282" width="187" height="132" fill="#1a1a1a"/>
  <rect x="389" y="422" width="387" height="156" fill="#1e1e1e"/>

  <!-- LIVING ROOM furniture -->
  <!-- sofa (L-shape) -->
  <rect x="162" y="248" width="175" height="54" rx="6" fill="#292929" stroke="#3c3c3c" stroke-width="1.5"/>
  <rect x="162" y="194" width="54" height="108" rx="6" fill="#292929" stroke="#3c3c3c" stroke-width="1.5"/>
  <!-- coffee table -->
  <rect x="225" y="195" width="88" height="52" rx="4" fill="#242424" stroke="#363636" stroke-width="1"/>
  <!-- TV unit against divider wall -->
  <rect x="368" y="126" width="14" height="100" rx="3" fill="#252525" stroke="#383838" stroke-width="1"/>
  <!-- plant -->
  <circle cx="205" cy="134" r="20" fill="#1e2a1e" stroke="#2d3a2d" stroke-width="2"/>
  <circle cx="205" cy="134" r="11" fill="#243424" stroke="#2d4a2d" stroke-width="1"/>
  <!-- dining table -->
  <circle cx="245" cy="488" r="46" fill="none" stroke="#303030" stroke-width="2"/>
  <circle cx="245" cy="488" r="41" fill="#1e1e1e"/>
  <rect x="222" y="432" width="46" height="18" rx="4" fill="#282828" stroke="#3a3a3a" stroke-width="1"/>
  <rect x="222" y="538" width="46" height="18" rx="4" fill="#282828" stroke="#3a3a3a" stroke-width="1"/>
  <rect x="184" y="466" width="18" height="44" rx="4" fill="#282828" stroke="#3a3a3a" stroke-width="1"/>
  <rect x="288" y="466" width="18" height="44" rx="4" fill="#282828" stroke="#3a3a3a" stroke-width="1"/>

  <!-- KITCHEN furniture -->
  <rect x="396" y="97" width="180" height="33" rx="2" fill="#262626" stroke="#393939" stroke-width="1.5"/>
  <rect x="556" y="97" width="26" height="170" rx="2" fill="#262626" stroke="#393939" stroke-width="1.5"/>
  <!-- stove -->
  <rect x="402" y="100" width="48" height="27" rx="2" fill="#2b2b2b"/>
  <circle cx="413" cy="107" r="5" fill="none" stroke="#555" stroke-width="1.5"/>
  <circle cx="428" cy="107" r="5" fill="none" stroke="#555" stroke-width="1.5"/>
  <circle cx="413" cy="119" r="5" fill="none" stroke="#555" stroke-width="1.5"/>
  <circle cx="428" cy="119" r="5" fill="none" stroke="#555" stroke-width="1.5"/>
  <!-- sink -->
  <rect x="465" y="100" width="38" height="27" rx="3" fill="#222222"/>
  <circle cx="484" cy="113" r="7" fill="none" stroke="#444" stroke-width="1.5"/>
  <!-- island -->
  <rect x="415" y="178" width="128" height="58" rx="4" fill="#262626" stroke="#393939" stroke-width="1.5"/>

  <!-- BATHROOM furniture -->
  <rect x="697" y="99" width="68" height="82" rx="6" fill="#252525" stroke="#383838" stroke-width="1"/>
  <ellipse cx="731" cy="163" rx="24" ry="20" fill="#262626" stroke="#383838" stroke-width="1"/>
  <rect x="598" y="99" width="55" height="38" rx="5" fill="#252525" stroke="#383838" stroke-width="1"/>
  <circle cx="626" cy="118" r="8" fill="none" stroke="#444" stroke-width="1.5"/>
  <rect x="598" y="152" width="82" height="112" rx="3" fill="#1b1b1b" stroke="#383838" stroke-width="1"/>
  <circle cx="656" cy="185" r="13" fill="none" stroke="#444" stroke-width="1.5"/>

  <!-- WARDROBE shelving -->
  <line x1="687" y1="288" x2="687" y2="412" stroke="#272727" stroke-width="1.5"/>
  <line x1="595" y1="316" x2="774" y2="316" stroke="#272727" stroke-width="1.5"/>
  <line x1="595" y1="348" x2="774" y2="348" stroke="#272727" stroke-width="1.5"/>
  <line x1="595" y1="380" x2="774" y2="380" stroke="#272727" stroke-width="1.5"/>
  <line x1="600" y1="300" x2="682" y2="300" stroke="#333" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="692" y1="300" x2="768" y2="300" stroke="#333" stroke-width="1" stroke-dasharray="5,3"/>

  <!-- FOYER -->
  <rect x="396" y="356" width="170" height="52" rx="4" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
  <rect x="396" y="288" width="60" height="20" rx="2" fill="#252525" stroke="#383838" stroke-width="1"/>

  <!-- BEDROOM furniture -->
  <rect x="442" y="436" width="182" height="145" rx="6" fill="#252525" stroke="#383838" stroke-width="1.5"/>
  <rect x="442" y="436" width="182" height="18" rx="5" fill="#2d2d2d" stroke="#3c3c3c" stroke-width="1"/>
  <rect x="455" y="458" width="68" height="34" rx="6" fill="#2a2a2a" stroke="#383838" stroke-width="1"/>
  <rect x="531" y="458" width="68" height="34" rx="6" fill="#2a2a2a" stroke="#383838" stroke-width="1"/>
  <rect x="404" y="454" width="34" height="34" rx="4" fill="#222222" stroke="#383838" stroke-width="1"/>
  <rect x="626" y="454" width="34" height="34" rx="4" fill="#222222" stroke="#383838" stroke-width="1"/>
  <rect x="680" y="430" width="92" height="52" rx="4" fill="#232323" stroke="#383838" stroke-width="1"/>
  <line x1="726" y1="430" x2="726" y2="482" stroke="#333" stroke-width="1"/>

  <!-- door gaps + swings -->
  <!-- front door -->
  <rect x="194" y="578" width="72" height="10" fill="#111111"/>
  <path d="M 194,582 Q 194,512 266,512" fill="none" stroke="#ccc6bc" stroke-width="1" stroke-dasharray="4,3" opacity="0.65"/>
  <!-- kitchen door -->
  <rect x="380" y="135" width="10" height="68" fill="#111111"/>
  <path d="M 385,135 Q 453,135 453,196" fill="none" stroke="#ccc6bc" stroke-width="1" stroke-dasharray="4,3" opacity="0.65"/>
  <!-- bathroom door -->
  <rect x="595" y="274" width="82" height="10" fill="#111111"/>
  <path d="M 595,278 Q 595,213 657,213" fill="none" stroke="#ccc6bc" stroke-width="1" stroke-dasharray="4,3" opacity="0.65"/>
  <!-- bedroom door -->
  <rect x="380" y="440" width="10" height="65" fill="#111111"/>
  <path d="M 385,440 Q 453,440 453,498" fill="none" stroke="#ccc6bc" stroke-width="1" stroke-dasharray="4,3" opacity="0.65"/>
  <!-- foyer opening (no door) -->
  <rect x="380" y="310" width="10" height="72" fill="#111111"/>

  <!-- LABELS + leader lines -->
  <!-- Living Room -->
  <text x="32" y="338" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#ccc6bc">Living Room</text>
  <line x1="134" y1="335" x2="152" y2="326" stroke="#ccc6bc" stroke-width="0.8" stroke-dasharray="3,3"/>
  <circle cx="152" cy="326" r="2.5" fill="#ccc6bc"/>
  <!-- Kitchen -->
  <text x="412" y="68" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#ccc6bc">Kitchen</text>
  <line x1="445" y1="72" x2="445" y2="88" stroke="#ccc6bc" stroke-width="0.8" stroke-dasharray="3,3"/>
  <circle cx="445" cy="88" r="2.5" fill="#ccc6bc"/>
  <!-- Bathroom -->
  <text x="625" y="68" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#ccc6bc">Bathroom</text>
  <line x1="687" y1="72" x2="687" y2="88" stroke="#ccc6bc" stroke-width="0.8" stroke-dasharray="3,3"/>
  <circle cx="687" cy="88" r="2.5" fill="#ccc6bc"/>
  <!-- Wardrobe -->
  <text x="796" y="348" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#ccc6bc">Wardrobe</text>
  <line x1="794" y1="345" x2="778" y2="338" stroke="#ccc6bc" stroke-width="0.8" stroke-dasharray="3,3"/>
  <circle cx="778" cy="338" r="2.5" fill="#ccc6bc"/>
  <!-- Foyer -->
  <text x="385" y="618" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#ccc6bc">Foyer</text>
  <line x1="418" y1="614" x2="468" y2="582" stroke="#ccc6bc" stroke-width="0.8" stroke-dasharray="3,3"/>
  <circle cx="468" cy="582" r="2.5" fill="#ccc6bc"/>
  <!-- Bed Room -->
  <text x="575" y="635" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#ccc6bc">Bed Room</text>
  <line x1="610" y1="630" x2="575" y2="582" stroke="#ccc6bc" stroke-width="0.8" stroke-dasharray="3,3"/>
  <circle cx="575" cy="582" r="2.5" fill="#ccc6bc"/>

  <!-- scale bar -->
  <line x1="155" y1="620" x2="355" y2="620" stroke="#ccc6bc" stroke-width="1.5"/>
  <line x1="155" y1="614" x2="155" y2="626" stroke="#ccc6bc" stroke-width="1.5"/>
  <line x1="255" y1="614" x2="255" y2="626" stroke="#ccc6bc" stroke-width="1.5"/>
  <line x1="355" y1="614" x2="355" y2="626" stroke="#ccc6bc" stroke-width="1.5"/>
  <text x="155" y="638" font-family="Arial,sans-serif" font-size="10" fill="#6a6460" text-anchor="middle">0</text>
  <text x="255" y="638" font-family="Arial,sans-serif" font-size="10" fill="#6a6460" text-anchor="middle">5m</text>
  <text x="355" y="638" font-family="Arial,sans-serif" font-size="10" fill="#6a6460" text-anchor="middle">10m</text>
</svg>
